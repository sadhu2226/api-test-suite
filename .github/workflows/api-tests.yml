name: API Test Suite

# Runs automatically on every push and pull request to main,
# plus a manual "Run workflow" button in the GitHub UI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API test suite
        run: npx playwright test
        env:
          # Set REQRES_API_KEY in your repo's Settings > Secrets and variables > Actions
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}

      - name: Upload HTML report
        if: always() # upload even if tests fail, so you can see why
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
